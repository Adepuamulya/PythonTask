
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Library Management System</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#667eea,#764ba2);
      min-height:100vh;
      padding:30px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    /* HEADER */

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .header h1{
      color:white;
      font-size:36px;
    }

    .add-btn{
      background:#00c853;
      color:white;
      border:none;
      padding:14px 22px;
      border-radius:12px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    .add-btn:hover{
      background:#00b248;
      transform:scale(1.05);
    }

    /* SEARCH */

    .search-box{
      margin-bottom:25px;
    }

    .search-box input{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      font-size:16px;
      outline:none;
    }

    /* TABLE */

    .table-container{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    thead{
      background:linear-gradient(to right,#ff512f,#dd2476);
      color:white;
    }

    th{
      padding:18px;
      text-align:left;
    }

    td{
      padding:18px;
      border-bottom:1px solid #eee;
    }

    tr:hover{
      background:#f5f5ff;
    }

    /* STATUS */

    .available{
      background:#00c853;
      color:white;
      padding:8px 14px;
      border-radius:20px;
    }

    .issued{
      background:#ff9800;
      color:white;
      padding:8px 14px;
      border-radius:20px;
    }

    /* BUTTONS */

    .edit-btn{
      background:#2962ff;
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
      margin-right:8px;
    }

    .edit-btn:hover{
      background:#0039cb;
    }

    .delete-btn{
      background:#ff1744;
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      cursor:pointer;
    }

    .delete-btn:hover{
      background:#d50000;
    }

    /* MODAL */

    .modal{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      background:white;
      width:400px;
      padding:30px;
      border-radius:20px;
    }

    .modal-content h2{
      margin-bottom:20px;
      color:#5e35b1;
    }

    .modal-content label{
      display:block;
      margin-top:12px;
      margin-bottom:5px;
      font-weight:bold;
    }

    .modal-content input,
    .modal-content select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
    }

    .modal-buttons{
      display:flex;
      justify-content:space-between;
      margin-top:25px;
    }

    .save-btn{
      background:#00c853;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
    }

    .cancel-btn{
      background:#ff1744;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:10px;
      cursor:pointer;
    }

    @media(max-width:768px){

      .header{
        flex-direction:column;
        gap:15px;
      }

      table{
        min-width:700px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <div class="header">

      <h1>Library Management System</h1>

      <button class="add-btn" onclick="openModal()">
        + Add Book
      </button>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search books..."
        onkeyup="searchBooks()"
      >

    </div>

    <!-- TABLE -->

    <div class="table-container">

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Book Name</th>
            <th>Author</th>
            <th>Category</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>

        </thead>

        <tbody id="bookTable"></tbody>

      </table>

    </div>

  </div>

  <!-- MODAL -->

  <div class="modal" id="bookModal">

    <div class="modal-content">

      <h2 id="modalTitle">Add Book</h2>

      <label>Book Name</label>
      <input type="text" id="bookName">

      <label>Author</label>
      <input type="text" id="author">

      <label>Category</label>
      <input type="text" id="category">

      <label>Status</label>

      <select id="status">
        <option>Available</option>
        <option>Issued</option>
      </select>

      <div class="modal-buttons">

        <button class="save-btn" onclick="saveBook()">
          Save
        </button>

        <button class="cancel-btn" onclick="closeModal()">
          Cancel
        </button>

      </div>

    </div>

  </div>

  <script>

    let books = [
      {
        id:1,
        name:"The Great Gatsby",
        author:"F. Scott Fitzgerald",
        category:"Fiction",
        status:"Available"
      },
      {
        id:2,
        name:"JavaScript Basics",
        author:"John Doe",
        category:"Programming",
        status:"Issued"
      }
    ];

    let editIndex = null;

    // DISPLAY BOOKS

    function displayBooks(data = books){

      const table = document.getElementById("bookTable");

      table.innerHTML = "";

      data.forEach((book,index)=>{

        table.innerHTML += `

          <tr>

            <td>${book.id}</td>

            <td>${book.name}</td>

            <td>${book.author}</td>

            <td>${book.category}</td>

            <td>
              <span class="${book.status === 'Available' ? 'available' : 'issued'}">
                ${book.status}
              </span>
            </td>

            <td>

              <button
                class="edit-btn"
                onclick="editBook(${index})"
              >
                Edit
              </button>

              <button
                class="delete-btn"
                onclick="deleteBook(${index})"
              >
                Delete
              </button>

            </td>

          </tr>

        `;

      });

    }

    // OPEN MODAL

    function openModal(){

      document.getElementById("bookModal").style.display = "flex";

      clearForm();

      editIndex = null;

      document.getElementById("modalTitle").innerText = "Add Book";

    }

    // CLOSE MODAL

    function closeModal(){

      document.getElementById("bookModal").style.display = "none";

    }

    // CLEAR FORM

    function clearForm(){

      document.getElementById("bookName").value = "";
      document.getElementById("author").value = "";
      document.getElementById("category").value = "";
      document.getElementById("status").value = "Available";

    }

    // SAVE BOOK

    function saveBook(){

      const name = document.getElementById("bookName").value;

      const author = document.getElementById("author").value;

      const category = document.getElementById("category").value;

      const status = document.getElementById("status").value;

      if(name === "" || author === "" || category === ""){

        alert("Please fill all fields");

        return;
      }

      if(editIndex === null){

        books.push({

          id: books.length + 1,
          name:name,
          author:author,
          category:category,
          status:status

        });

      }else{

        books[editIndex] = {

          id: books[editIndex].id,
          name:name,
          author:author,
          category:category,
          status:status

        };

      }

      displayBooks();

      closeModal();

    }

    // EDIT BOOK

    function editBook(index){

      editIndex = index;

      const book = books[index];

      document.getElementById("bookName").value = book.name;

      document.getElementById("author").value = book.author;

      document.getElementById("category").value = book.category;

      document.getElementById("status").value = book.status;

      document.getElementById("modalTitle").innerText = "Edit Book";

      document.getElementById("bookModal").style.display = "flex";

    }

    // DELETE BOOK

    function deleteBook(index){

      const confirmDelete = confirm("Are you sure you want to delete this book?");

      if(confirmDelete){

        books.splice(index,1);

        displayBooks();

      }

    }

    // SEARCH BOOKS

    function searchBooks(){

      const search =
      document.getElementById("searchInput").value.toLowerCase();

      const filteredBooks = books.filter(book =>

        book.name.toLowerCase().includes(search)

      );

      displayBooks(filteredBooks);

    }

    // INITIAL DISPLAY

    displayBooks();

  </script>

</body>
</html>
